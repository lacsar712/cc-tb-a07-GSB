<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>茶叶拼配审评台</title>
  <style>
    body { font-family: "Palatino Linotype", serif; background: #f6f1e7; color: #3f2e22; margin: 0; }
    header { background: #6b3e26; color: #fff; padding: 12px 20px; display: flex; gap: 16px; align-items: baseline; }
    header a { color: #f6e7c1; }
    header .spacer { flex: 1; }
    main { max-width: 860px; margin: 20px auto; padding: 0 16px; }
    table { width: 100%; background: #fffaf3; border-collapse: collapse; }
    td, th { padding: 8px; border-bottom: 1px solid #e6d3c0; text-align: left; }
    form { background: #fffaf3; padding: 12px; margin-bottom: 16px; border: 1px solid #e6d3c0; }
    .pass { color: #166534; } .fail { color: #9f1239; }
    .card { background: #fffaf3; border: 1px solid #e6d3c0; padding: 14px 16px; margin-bottom: 16px; }
    .badge { display: inline-block; background: #6b3e26; color: #f6e7c1; border-radius: 10px; padding: 1px 10px; font-size: 12px; }
    .badge.draft { background: #a98446; }
    .readonly { background: #f1e9db; border: 1px dashed #b9a486; }
    .muted { color: #8a7358; font-size: 13px; }
    .flash { background: #fdeccb; border: 1px solid #d8b25a; padding: 8px 12px; margin-bottom: 12px; }
    .err { color: #9f1239; }
    label.chk { display: inline-block; min-width: 9em; margin: 4px 10px 4px 0; }
    a.btn, button { cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <strong>茶叶拼配审评台</strong>
    {% if session.user %}
      <a href="{{ url_for('home') }}">交评</a>
      <a href="{{ url_for('recipes_page') }}">配方版本</a>
      <span class="spacer"></span>
      <span>{{ session.user }}（{{ '审评员' if session.role == 'writer' else '观察员' }}）</span>
      <a href="{{ url_for('logout') }}">退出</a>
    {% endif %}
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block body %}{% endblock %}
  </main>
  <script>
    document.addEventListener("submit", async (event) => {
      const form = event.target;
      if (!form.dataset.swap) return;
      event.preventDefault();
      const res = await fetch(form.action, {
        method: "POST",
        body: new FormData(form),
        headers: { "HX-Request": "true" },
      });
      const html = await res.text();
      if (!res.ok) { alert(html); return; }
      document.querySelector("#rows").insertAdjacentHTML("afterbegin", html);
      form.reset();
    });
  </script>
</body>
</html>
