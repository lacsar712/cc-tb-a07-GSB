<tr>
  <td>{{ row.lot }}</td>
  <td>{% if row.recipe_version_no %}版本 {{ row.recipe_version_no }}{% else %}<span class="muted">—</span>{% endif %}</td>
  <td>{{ row.score }}</td>
  <td class="{% if row.verdict == '通过' %}pass{% else %}fail{% endif %}">{{ row.verdict }}</td>
  <td>{{ row.note }}</td>
</tr>
